<app-card-template [headerLabel]="config.header!">
  <form [formGroup]="form">
    <div class="flex gap-3">
      <!-- ประเภทวัตถุ -->
      <div class="w-1/2">
        <label class="block font-semibold mb-2">ประเภทวัตถุ <span class="text-danger">*</span></label>
        <app-floor-object-type-dropdown
          formControlName="objectType"
        ></app-floor-object-type-dropdown>
        <app-field-error
          [control]="form.controls['objectType']"
          type="select"
        />
      </div>

      <!-- ชื่อวัตถุ -->
      <div class="w-1/2">
        <label class="block font-semibold mb-2">ชื่อป้ายกำกับ <span class="text-danger">*</span></label>
        <input
          type="text"
          pInputText
          formControlName="label"
          placeholder="ชื่อป้ายกำกับ"
          class="w-full"
        />
        <app-field-error [control]="form.controls['label']" type="text" />
      </div>
    </div>
  </form>

  <p-footer>
    <p-button
      label="ยกเลิก"
      severity="secondary"
      variant="outlined"
      (onClick)="onCancel()"
      [disabled]="isSubmitting()"
    />
    <p-button
      label="บันทึก"
      severity="primary"
      (onClick)="onSubmit()"
      [loading]="isSubmitting()"
    />
  </p-footer>
</app-card-template>
