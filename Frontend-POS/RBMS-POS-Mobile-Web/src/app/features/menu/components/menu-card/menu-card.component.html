<button
  class="bg-surface-card rounded-xl text-left w-full active:scale-[0.98] transition-all group"
  [ngClass]="cardRingClass"
  (click)="cardClick.emit()"
>
  <!-- Image -->
  <div class="relative aspect-square bg-surface-hover flex items-center justify-center overflow-hidden rounded-t-xl">
    @if (item.imageFileId) {
      <img
        [src]="imageUrl"
        [alt]="item.name"
        class="w-full h-full object-cover group-active:scale-105 transition-transform duration-300"
      />
    } @else {
      <app-generic-icon [name]="placeholderIcon" svgClass="w-20 h-20" class="text-surface-sub"></app-generic-icon>
    }
    <!-- Pinned Badge (มุมซ้ายบน) -->
    @if (item.isPinned) {
      <span class="absolute top-1.5 left-1.5 w-7 h-7 rounded-full bg-tag-pin flex items-center justify-center">
        <app-generic-icon name="pin-tag" svgClass="w-4 h-4" class="text-white"></app-generic-icon>
      </span>
    }
    <!-- Tag Badges (มุมขวาบน) -->
    @if (item.tags) {
      <div class="absolute top-1.5 right-1.5 flex flex-col gap-1">
        @if (hasTag(1)) {
          <span class="w-8 h-8 rounded-full bg-tag-recommend flex items-center justify-center">
            <app-generic-icon name="thumb-tag" svgClass="w-4 h-4" class="text-white"></app-generic-icon>
          </span>
        }
        @if (hasTag(2)) {
          <span class="w-8 h-8 rounded-full bg-tag-seasonal flex items-center justify-center">
            <app-generic-icon name="clover-tag" svgClass="w-4 h-4" class="text-white"></app-generic-icon>
          </span>
        }
        @if (hasTag(4)) {
          <span class="w-8 h-8 rounded-full bg-tag-slow flex items-center justify-center">
            <app-generic-icon name="time-tag" svgClass="w-4 h-4" class="text-white"></app-generic-icon>
          </span>
        }
      </div>
    }
  </div>
  <!-- Info -->
  <div class="p-3">
    <div class="flex items-start gap-1">
      <span class="font-bold text-base line-clamp-1 flex-1">{{ item.name }}</span>
      @if (item.allergens) {
        <app-generic-icon
          name="shield-warning"
          svgClass="w-6 h-6"
          class="text-warning flex-shrink-0"
        ></app-generic-icon>
      }
    </div>
    @if (item.nameEn) {
      <div class="text-sm text-surface-sub line-clamp-1">{{ item.nameEn }}</div>
    }
    @if (item.caloriesPerServing) {
      <div class="text-sm text-surface-sub mt-0.5 flex items-center gap-0.5">
        <app-generic-icon name="thunder" svgClass="w-5 h-5" class="text-primary"></app-generic-icon>
        {{ item.caloriesPerServing }} Kcal
      </div>
    }
    <div class="flex items-end justify-between mt-1.5">
      <div>
        @if (item.hasOptions) {
          <app-generic-icon name="option-extra" svgClass="w-6 h-6" class="text-surface-sub"></app-generic-icon>
        }
      </div>
      <span class="text-lg font-bold text-primary">
        {{ item.price | number:'1.0-0' }} บาท
      </span>
    </div>
  </div>
</button>
