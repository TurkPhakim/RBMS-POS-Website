<app-card-template [headerLabel]="config.header!">
  <form [formGroup]="form" class="space-y-4">
    <!-- ข้อมูลลูกค้า -->
    <div>
      <h3 class="text-lg font-semibold text-primary mb-3">ข้อมูลลูกค้า</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="customerName" class="block font-semibold mb-2">
            ชื่อลูกค้า <span class="text-danger">*</span>
          </label>
          <input
            pInputText
            id="customerName"
            formControlName="customerName"
            placeholder="ชื่อลูกค้า"
            class="w-full"
          />
          <app-field-error [control]="form.get('customerName')" type="text" />
        </div>

        <div>
          <label for="customerPhone" class="block font-semibold mb-2">
            เบอร์โทรติดต่อลูกค้า <span class="text-danger">*</span>
          </label>
          <input
            pInputText
            id="customerPhone"
            formControlName="customerPhone"
            placeholder="เบอร์โทรติดต่อลูกค้า"
            class="w-full"
            maxlength="10"
            (keypress)="'0123456789'.includes($event.key)"
            (paste)="$event.preventDefault()"
          />
          <app-field-error [control]="form.get('customerPhone')" type="text" />
        </div>

        <div>
          <label for="guestCount" class="block font-semibold mb-2">
            จำนวนคน <span class="text-danger">*</span>
          </label>
          <p-inputNumber
            id="guestCount"
            formControlName="guestCount"
            [min]="1"
            [max]="50"
            [showButtons]="true"
            buttonLayout="horizontal"
            incrementButtonIcon="pi pi-plus"
            decrementButtonIcon="pi pi-minus"
            inputStyleClass="w-full"
            styleClass="w-full"
          ></p-inputNumber>
          <app-field-error [control]="form.get('guestCount')" type="text" />
        </div>
      </div>
    </div>

    <hr class="border-surface-border border-2" />

    <!-- ข้อมูลการจอง -->
    <div>
      <h3 class="text-lg font-semibold text-primary text-primary-dark mb-3">
        ข้อมูลการจอง
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <div class="md:col-span-3">
          <label class="block font-semibold mb-2">
            วันที่และเวลาจอง <span class="text-danger">*</span>
          </label>
          <p-datepicker
            formControlName="reservationDateTime"
            dateFormat="dd/mm/yy"
            placeholder="วันที่และเวลาจอง"
            [showTime]="true"
            [hourFormat]="'24'"
            [showClear]="true"
            [minDate]="minDate"
            styleClass="w-full"
          />
          <app-field-error
            [control]="form.get('reservationDateTime')"
            type="select"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block font-semibold mb-2">โต๊ะที่นั่ง</label>
          <app-available-table-dropdown
            formControlName="tableId"
          ></app-available-table-dropdown>
        </div>

        <div class="md:col-span-5">
          <label for="note" class="block font-semibold mb-2"
            >หมายเหตุลูกค้า</label
          >
          <textarea
            pInputTextarea
            id="note"
            formControlName="note"
            placeholder="หมายเหตุลูกค้า"
            [rows]="3"
            class="w-full"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Audit Footer (edit mode only) -->
    @if (isEditMode() && reservation) {
      <app-audit-footer
        [createdAt]="reservation.createdAt"
        [createdByName]="reservation.createdBy"
        [updatedAt]="reservation.updatedAt"
        [updatedByName]="reservation.updatedBy"
        [compact]="true"
      />
    }
  </form>

  <p-footer>
    <p-button
      label="ยกเลิก"
      severity="secondary"
      variant="outlined"
      (onClick)="onCancel()"
      [disabled]="isSubmitting()"
    />
    @if (!isEditMode() || canUpdate) {
      <p-button
        label="บันทึก"
        severity="primary"
        (onClick)="onSubmit()"
        [loading]="isSubmitting()"
      />
    }
  </p-footer>
</app-card-template>
