<app-card-template [headerLabel]="config.header!">
  <div class="space-y-4">
    <form [formGroup]="form">
      <!-- Amount -->
      <div>
        <label class="block font-semibold mb-2"
          >จำนวนเงิน <span class="text-danger">*</span></label
        >
        <p-inputgroup>
          <p-inputNumber
            formControlName="amount"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [min]="0"
            mode="decimal"
            styleClass="w-full"
            placeholder="จำนวนเงิน"
          ></p-inputNumber>
          <p-inputgroup-addon>บาท</p-inputgroup-addon>
        </p-inputgroup>
        <app-field-error [control]="form.controls['amount']"></app-field-error>
      </div>

      <!-- Reason -->
      <div class="mt-4">
        <label class="block font-semibold mb-2"
          >ระบุเหตุผล <span class="text-danger">*</span></label
        >
        <textarea
          pInputTextarea
          formControlName="reason"
          rows="3"
          class="w-full"
          placeholder="ระบุเหตุผล"
        ></textarea>
        <app-field-error [control]="form.controls['reason']"></app-field-error>
      </div>
    </form>
  </div>

  <p-footer>
    <button
      pButton
      label="ยกเลิก"
      severity="secondary"
      [outlined]="true"
      (click)="onCancel()"
    ></button>
    <button
      pButton
      [label]="isEditMode ? 'บันทึก' : isCashIn ? 'เงินเข้า' : 'เงินออก'"
      severity="warn"
      [loading]="isSaving()"
      (click)="onSave()"
    ></button>
  </p-footer>
</app-card-template>
