<div class="rounded-xl overflow-hidden border border-surface-border flex">
  <div
    class="w-2 shrink-0"
    [ngClass]="{
      'bg-primary': accentColor === 'primary',
      'bg-success': accentColor === 'success',
      'bg-warning': accentColor === 'warning',
      'bg-info': accentColor === 'info'
    }"
  ></div>
  <div class="flex-1 bg-surface-card p-4 flex items-center gap-4">
    <div class="flex items-center justify-center shrink-0">
      <app-generic-icon
        [name]="icon"
        svgClass="w-12 h-12"
        [ngClass]="{
          'text-primary': accentColor === 'primary',
          'text-success': accentColor === 'success',
          'text-warning-dark': accentColor === 'warning',
          'text-info': accentColor === 'info'
        }"
      ></app-generic-icon>
    </div>
    <div class="flex flex-col flex-1">
      <span class="text-xl font-semibold text-surface-sub">{{ label }}</span>
      <span
        class="text-2xl font-bold"
        [ngClass]="{
          'text-primary': accentColor === 'primary',
          'text-success': accentColor === 'success',
          'text-warning-dark': accentColor === 'warning',
          'text-info': accentColor === 'info'
        }"
        >{{ value }}</span
      >
    </div>
    @if (showComparison) {
      <div class="shrink-0 text-right">
        @if (changePercent !== null) {
          <div
            class="flex items-center gap-1 text-sm font-semibold"
            [ngClass]="changePercent >= 0 ? 'text-success' : 'text-danger'"
          >
            <i
              [class]="
                changePercent >= 0 ? 'pi pi-arrow-up' : 'pi pi-arrow-down'
              "
            ></i>
            <span
              >{{ changePercent >= 0 ? '+' : ''
              }}{{ changePercent | number: '1.1-1' }}%</span
            >
          </div>
        } @else {
          <div class="text-sm text-surface-sub">ไม่มีข้อมูลเปรียบเทียบ</div>
        }
      </div>
    }
  </div>
</div>
