<app-card-template [headerLabel]="config.header!">
  <div class="flex flex-col items-center gap-4">
    <img
      [src]="imageUrl"
      alt="สลิปโอนเงิน"
      class="max-h-[60vh] max-w-full rounded-lg border border-surface-border object-contain"
    />
  </div>

  <p-footer>
    <button
      pButton
      label="ปิด"
      severity="secondary"
      [outlined]="true"
      class="min-w-[120px]"
      (click)="ref.close()"
    ></button>
    <button
      pButton
      label="ดาวน์โหลด"
      severity="primary"
      (click)="onDownload()"
    ></button>
  </p-footer>
</app-card-template>
